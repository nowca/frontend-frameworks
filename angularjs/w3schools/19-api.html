 <!DOCTYPE html>
<html lang="en-US">
<script src="lib/angularjs.v1-6-9.min.js"></script>
<body ng-app="myApp">
    <!--
        AngularJS Global API

        The AngularJS Global API is a set of global JavaScript functions for performing common tasks like:

            Comparing objects
            Iterating objects
            Converting data

        The Global API functions are accessed using the angular object.

        Below is a list of some common API functions:

        API                     Description
        angular.lowercase()     Converts a string to lowercase
        angular.uppercase()     Converts a string to uppercase
        angular.isString()      Returns true if the reference is a string
        angular.isNumber()      Returns true if the reference is a number
    -->
    <div ng-app="myApp" ng-controller="myCtrl">
        <p>{{ x1 }}</p>
        <p>{{ x2 }}</p>
        <p>{{ x3 }}</p>
        <p>{{ x4 }}</p>
        <p>{{ x5 }}</p>
    </div>

    <script>
        var app = angular.module('myApp', []);
        app.controller('myCtrl', function($scope) {
            $scope.x1 = "JOHN";
            $scope.x2 = angular.lowercase($scope.x1);
            $scope.x3 = angular.uppercase($scope.x2);
            $scope.x4 = angular.isString($scope.x1);
            $scope.x5 = angular.isNumber($scope.x1);
        });
    </script>
</body>
</html>
